name: Java CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["8", "11", "17"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: maven

      - id: spotless
        run: mvn spotless:check animal-sniffer:check test verify
      # - if: failure()
      #   name: Test Spotless Failed
      # run: |
      #   wget https://raw.githubusercontent.com/hightouchio/circleci-notifications/master/slack-notify-branch.sh
      #   chmod u+x slack-notify-branch.sh
      #   BUILD_STATUS="Failed" NOTIFY_BRANCH="master" ./slack-notify-branch.sh
      - if: steps.spotless.conclusion == 'success'
        run: mvn -B package
