name: Java CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["8", "11", "17", "21", "25"]
        include:
          - java: "8"
            maven_goals: verify
          - java: "11"
            maven_goals: verify
          - java: "17"
            maven_goals: "verify spotless:check animal-sniffer:check"
          - java: "21"
            maven_goals: verify
          - java: "25"
            maven_goals: verify

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: maven

      - name: Test
        run: mvn -B ${{ matrix.maven_goals }}
