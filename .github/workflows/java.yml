name: Java CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["8", "11", "17"]
        include:
          - java: "8"
            maven_goals: verify
          - java: "11"
            maven_goals: verify
          - java: "17"
            maven_goals: "verify spotless:check animal-sniffer:check"

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: maven

      - name: Test
        run: mvn -B ${{ matrix.maven_goals }}
